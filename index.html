#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:260px;height:80px;border-radius:80px;background:rgba(255,255,255,.35);filter:blur(14px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(110vw)}}
.spark{position:absolute;font-size:14px;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.petal{position:absolute;top:-30px;animation:fall linear infinite}
@keyframes fall{to{transform:translate(90px,110vh) rotate(540deg)}}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto}
header{text-align:center;padding:10px 0 14px}
h1{font-family:'Mochiy Pop One',cursive;font-size:clamp(26px,5vw,52px);margin:0;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 #ff7fb8,0 6px 0 #b49bf0,0 10px 22px rgba(120,60,160,.5)}
.date{display:inline-block;margin-top:12px;background:var(--glass);padding:5px 18px;border-radius:99px;font-weight:800}
.quote{max-width:640px;margin:10px auto 0;font-style:italic;font-weight:700;background:var(--glass);border-radius:18px;padding:8px 16px;min-height:42px;transition:opacity .5s}
.grid{display:grid;grid-template-columns:330px 1fr 330px;gap:14px;align-items:start}
.panel{background:var(--glass);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.8);border-radius:26px;padding:14px;box-shadow:0 8px 28px rgba(140,80,190,.25)}
h2{font-family:'Mochiy Pop One';font-size:17px;margin:0 0 10px}
.ch{background:var(--card);border-radius:16px;padding:8px 10px;margin-bottom:8px;border-left:6px solid var(--c)}
.ch b{font-size:12px;color:#ff5fa8}
.ch .n{font-weight:800;font-size:14px}
.meta{font-size:12px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.bar{height:7px;border-radius:9px;background:rgba(150,120,200,.2);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .4s}
label.tk{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;cursor:pointer}
input[type=checkbox]{accent-color:#ff6fb0;width:18px;height:18px}
.stk{margin-left:auto;animation:pop .4s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.timer{text-align:center}
.modes button{border:0;background:var(--pink2);color:#7a3a70;border-radius:99px;padding:6px 14px;font:800 13px Nunito;margin:0 3px;cursor:pointer}
.modes button.on{background:var(--lav);color:#fff}
.adj{margin-top:10px;font-weight:800;font-size:14px}.adj button{border:0;background:var(--mint);color:#2f6b58;border-radius:99px;padding:5px 12px;font:800 13px Nunito;cursor:pointer;margin:0 2px}.adj input{width:64px;border-radius:12px;border:2px solid var(--lav);background:var(--card);color:var(--ink);font:800 15px Nunito;padding:4px;text-align:center}.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.ring{position:relative;width:240px;height:240px;margin:12px auto}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;font:400 46px 'Mochiy Pop One'}
.ring small{font:800 13px Nunito;text-align:center}
.btns button{border:0;border-radius:99px;padding:12px 22px;margin:4px;font:800 16px Nunito;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .1s}
.btns button:active{transform:translateY(4px);box-shadow:none}
.b1{background:#ff8fc2}.b2{background:#9bb8ff}.b3{background:#7fdcbd}
.mascots{font-size:34px;display:flex;justify-content:center;gap:16px}
.mascots span{animation:hop 1.2s ease-in-out infinite}
.mascots span:nth-child(2){animation-delay:.2s}.mascots span:nth-child(3){animation-delay:.4s}
@keyframes hop{50%{transform:translateY(-10px) rotate(6deg)}}
.row{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:7px 10px;margin-bottom:7px}
.row select{margin-left:auto;max-width:150px;border-radius:9px;border:1px solid var(--lav);background:var(--card);color:var(--ink);font:700 12px Nunito;padding:3px}
.row.done span.l{text-decoration:line-through;opacity:.6}
.cal{margin-top:14px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.mo{background:var(--card);border-radius:18px;padding:10px}
.mo h3{margin:0 0 6px;font-size:15px;line-height:1.35}
.mm{font-family:'Noto Sans Meetei Mayek',sans-serif}
.mo.now{outline:3px solid var(--pink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.days .wd{font-weight:800;font-size:10px;line-height:1.1;padding:2px 0;background:rgba(200,180,245,.35);border-radius:6px}
.days .wd em{display:block;font:normal 7px 'Noto Sans Meetei Mayek';word-break:break-all;opacity:.85}
.days div.d{padding:4px 0;border-radius:8px}
.days .today{background:#ff6fb0;color:#fff;font-weight:800;box-shadow:0 0 10px #ff6fb0}
.legend{font-size:12px;margin-top:6px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

let S={rec:{},pomo:{}};
try{S=JSON.parse(localStorage.getItem("kenny-pomo")||"")||S}catch(e){}
const save=()=>{try{localStorage.setItem("kenny-pomo",JSON.stringify(S))}catch(e){}};

const QU=["Don’t. Spend. Another. Year. Doing. The. Same. Sh*t.",...QS];let qi=0;

document.querySelectorAll("#dots button").forEach(b=>b.onclick=()=>{showQ(+b.dataset.i);clearInterval(qt);qt=setInterval(nextQ,5500)});
function nextQ(){showQ((qi+1)%QU.length)}let qt=setInterval(nextQ,5500);$("qt").textContent=QU[0];document.querySelectorAll("#dots button")[0].classList.add("on");

function counts(){const c=CH.map(h=>({lec:h[3],dpp:h[4]}));for(const k in S.rec){const r=S.rec[k];if(r&&c[r.c])c[r.c][r.t]++}return c}

return `<div class="ch" style="--c:${COL[i%4]}"><b>CH-${String(i+1).padStart(2,"0")}</b> <span class="n">${h[0]}</span>

function renderDaily(){$("daily").innerHTML=ROUT.map((r,j)=>{const k=TODAY+"|"+r[0],d=!!S.rec[k]||!!(S.rec[k+"|x"]);const sel=S.sel&&S.sel[k]!=null?S.sel[k]:0;

const sync=(k,t,on)=>{const s=document.querySelector(`select[data-k="${k}"]`);if(t){S.sel=S.sel||{};S.sel[k]=s?+s.value:0;setRec(k,on?{c:S.sel[k],t}:null)}else setRec(k,on?{c:-1,t:"x"}:null)};

function renderChart(){const days=[];for(let i=6;i>=0;i--){const d=new Date(NOW);d.setDate(d.getDate()-i);days.push(d)}
const P=days.map(d=>S.pomo[iso(d)]||0),T=days.map(d=>Object.keys(S.rec).filter(k=>k.startsWith(iso(d)+"|")).length);

for(let i=0;i<=4;i++){const y=H-b-(H-b-10)*i/4;g+=`<line x1="24" x2="${W}" y1="${y}" y2="${y}" stroke="#c9b6f5" stroke-opacity=".4"/><text x="18" y="${y+3}" font-size="9" text-anchor="end" fill="currentColor">${Math.round(mx*i/4)}</text>`}
days.forEach((d,i)=>{const x=32+i*38,h1=(H-b-10)*P[i]/mx,h2=(H-b-10)*T[i]/mx;
g+=`<rect x="${x}" y="${H-b-h1}" width="14" height="${h1}" rx="6" fill="#ff9ecb"/><rect x="${x+15}" y="${H-b-h2}" width="14" height="${h2}" rx="6" fill="#b49bf0"/><text x="${x+15}" y="${H-10}" font-size="9" text-anchor="middle" fill="currentColor">${WE[d.getDay()]}</text>`});
$("chart").innerHTML=g+"</svg>";
const L=counts().reduce((a,c)=>a+c.lec,0),tl=CH.reduce((a,c)=>a+c[1],0);$("tot").textContent=`Lectures: ${L}/${tl} · Pomodoros: ${P.reduce((a,b)=>a+b,0)} this week 💪`}
function renderAll(){renderSide();renderDaily();renderChart();$("pc").textContent=S.pomo[TODAY]||0}

/* timer */
const MODES=[["Focus 🌸",25,1],["Short break 🍵",5,0],["Long break 🛌",15,0],["1 Hour 📖",60,1],["2 Hours 🔥",120,1]];
const ICON=["🌸","🍵","🛌","📖","🔥"];
try{const d=JSON.parse(localStorage.getItem("kenny-dur")||"[]");d.forEach((v,i)=>{if(v>0&&MODES[i])MODES[i][1]=v})}catch(e){}
let mode=0,left=MODES[0][1]*60,run=null;
function saveDur(){try{localStorage.setItem("kenny-dur",JSON.stringify(MODES.map(m=>m[1])))}catch(e){}}
function renderModes(){$("modes").innerHTML=MODES.map((m,i)=>`<button data-m="${i}" class="${i==mode?"on":""}">${ICON[i]} ${m[1]>=60&&m[1]%60==0?m[1]/60+"h":m[1]+"m"}</button>`).join("");
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(+b.dataset.m));$("mins").value=MODES[mode][1]}
function fmt(t){const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,z=n=>String(n).padStart(2,"0");return (h?h+":":"")+z(m)+":"+z(s)}
function setMode(i){mode=i;left=MODES[i][1]*60;stop();renderModes();draw()}
function draw(){const t=MODES[mode][1]*60;$("time").textContent=fmt(left);$("arc").style.strokeDashoffset=653.5*(1-left/t);$("mlab").textContent=MODES[mode][0];document.title=(run?fmt(left)+" · ":"")+"Kenny’s Pomodoro 🌸"}
function stop(){clearInterval(run);run=null}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.4)}catch(e){}}
function setMins(v){v=Math.max(1,Math.min(480,Math.round(+v)||MODES[mode][1]));MODES[mode][1]=v;saveDur();setMode(mode)}
$("go").onclick=()=>{if(run)return;run=setInterval(()=>{left--;if(left<=0){stop();beep();if(MODES[mode][2]){S.pomo[TODAY]=(S.pomo[TODAY]||0)+Math.max(1,Math.round(MODES[mode][1]/25));save();renderAll();setMode(1)}else setMode(0);return}draw()},1000)};
$("pause").onclick=()=>{stop();draw()};$("reset").onclick=()=>setMode(mode);
$("minus").onclick=()=>setMins(+$("mins").value-5);$("plus").onclick=()=>setMins(+$("mins").value+5);$("setm").onclick=()=>setMins($("mins").value);
$("mins").onkeydown=e=>{if(e.key=="Enter")setMins($("mins").value)};
setMode(0);

/* calendar */
function renderCal(){const y=NOW.getFullYear(),m=NOW.getMonth(),mm=MM[m],f=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
let h=`<div class="mo now"><h3><span class="mm">${mm[0]}</span> ${mm[1]} / ${MON[m]}–${MON[(m+1)%12]}<br>${MON[m]} ${y}</h3><div class="days">`;
for(let i=0;i<7;i++)h+=`<div class="wd">${WE[i]}<em>${WM[i]}</em></div>`;
for(let i=0;i<f;i++)h+="<div></div>";
for(let d=1;d<=dim;d++){const w=(f+d-1)%7,we=w==0||w==6;h+=`<div class="d ${we?"we":""} ${d==NOW.getDate()?"today":""}">${d}${we?`<small>${w?"🍡":"🌸"}</small>`:""}</div>`}
$("months").innerHTML=h+"</div></div>"}
renderCal();renderAll();

/* background life */
const fx=$("fx");
for(let i=0;i<4;i++){const c=document.createElement("div");c.className="cloud";c.style.cssText=`top:${8+i*18}%;animation-duration:${70+i*25}s;animation-delay:-${i*22}s;opacity:${.5+i*.1}`;fx.appendChild(c)}
for(let i=0;i<26;i++){const s=document.createElement("div");s.className="spark";s.textContent=i%3?"✦":"✧";s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;color:#fff;animation-delay:${Math.random()*3}s;text-shadow:0 0 8px #ffb6e0`;fx.appendChild(s)}
for(let i=0;i<14;i++){const p=document.createElement("div");p.className="petal";p.textContent="🌸";p.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*12}px;animation-duration:${10+Math.random()*10}s;animation-delay:-${Math.random()*15}s`;fx.appendChild(p)}
</script></body></html>
